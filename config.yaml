camera:
  source: "${CAMERA_SOURCE}"        # set in .env file
  camera_id: "main-entrance"
  process_every_n_frames: 20
  reconnect_delay_seconds: 3
  show_preview: true

person_detection:
  model_path: "models/yolov10n.pt"
  confidence: 0.40
  tracker: "bytetrack.yaml"
  bbox_padding: 0              # no extra padding (reverted to original)

face:
  model_pack: "buffalo_l"     # contains SCRFD detector + recognition model
  model_root: ".insightface"
  providers:
    - "DmlExecutionProvider"
    - "CPUExecutionProvider"
  backend: "openvino"         # "onnxruntime" | "openvino"
  openvino_device: "AUTO"     # AUTO, CPU, GPU.0, GPU.1
  detection_size: 640
  detection_threshold: 0.50
  min_face_size: 28            # raised from 24: filters tiny low-quality faces
  blur_threshold: 50.0         # raised from 25: skips blurry faces with noisy embeddings
  match_threshold: 0.38        # raised from 0.22: safer confidence floor for ArcFace cosine similarity
  match_margin: 0.07           # raised from 0.03: wider gap required between 1st and 2nd best match
  vote_window: 5
  votes_required: 3            # raised from 2: 3/5 majority needed to confirm identity

attendance:
  line_y_ratio: 0.62           # raised slightly from 0.55
  inside_is_below_line: true
  duplicate_cooldown_seconds: 300
  event_database: "data/attendance.db"
  embedding_file: "data/embeddings.npz"
  allow_insecure_no_liveness: true
