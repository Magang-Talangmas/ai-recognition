camera:
  source: "${CAMERA_SOURCE}"                 # Loaded from .env or CAMERA_SOURCE env var
  camera_id: "main-entrance"
  process_every_n_frames: 1
  reconnect_delay_seconds: 3
  show_preview: true

person_detection:
  model_path: "models/yolov10n.pt"
  confidence: 0.40
  tracker: "bytetrack.yaml"
  half_precision: true

face:
  model_pack: "buffalo_l"     # contains SCRFD detector + recognition model
  model_root: ".insightface"
  providers:
    - "CUDAExecutionProvider"
    - "CPUExecutionProvider"
  provider_options:
    trt_fp16_enable: true
    trt_max_workspace_size: 2147483648
    trt_engine_cache_enable: true
  detection_size: 416
  detection_threshold: 0.35
  min_face_size: 50             # Skip faces smaller than 50px — reduces inference on small/distant faces
  blur_threshold: 10.0
  match_threshold: 0.35
  match_margin: 0.02
  vote_window: 1
  votes_required: 1
  batch_size: 32

attendance:
  line_y_ratio: 0.55
  inside_is_below_line: true
  duplicate_cooldown_seconds: 300
  event_database: "data/attendance.db"
  embedding_file: "data/embeddings.npz"
  allow_insecure_no_liveness: true
